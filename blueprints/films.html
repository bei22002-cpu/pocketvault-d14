<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nereid · Product Films</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Sora:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#071116; --panel:#0e1c24; --ink:#e7f0f2; --muted:#8aa0a8;
      --line:rgba(231,240,242,.12); --accent:#2ec4a8;
    }
    *{box-sizing:border-box;margin:0}
    body{
      font-family:Sora,system-ui,sans-serif;color:var(--ink);min-height:100vh;
      background:radial-gradient(900px 500px at 8% -10%,rgba(46,196,168,.14),transparent),var(--bg);
    }
    header{padding:28px 32px 16px;border-bottom:1px solid var(--line)}
    h1{font-family:Fraunces,Georgia,serif;font-size:2rem;letter-spacing:-.02em}
    header p{color:var(--muted);margin-top:8px;max-width:64ch}
    .links{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    .links a{
      color:var(--ink);text-decoration:none;border:1px solid var(--line);
      padding:8px 12px;border-radius:999px;font-size:.85rem;
    }
    .links a:hover{border-color:var(--accent);color:var(--accent)}
    main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 130px)}
    @media(max-width:900px){main{grid-template-columns:1fr}}
    nav{border-right:1px solid var(--line);padding:14px 10px;background:#050d11;overflow:auto}
    nav h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 6px}
    nav button{
      display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
      padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:.86rem;margin-bottom:3px;
    }
    nav button:hover{background:var(--panel)}
    nav button.active{background:var(--accent);color:#042019;font-weight:600}
    .stage{padding:20px 24px 40px}
    video{width:100%;max-height:calc(100vh - 240px);background:#000;border-radius:12px;border:1px solid var(--line)}
    .meta{margin-top:12px;color:var(--muted);font-size:.9rem}
    .meta strong{color:var(--ink)}
    .beats{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .beat{border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:.75rem;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <h1>Nereid · Product films</h1>
    <p>Eighteen cinematic films — photoreal exploded builds, underwater working shots, and lifestyle cuts.</p>
    <div class="links">
      <a href="rolltop.html">★ Roll-Up MVP</a>
      <a href="d14-approval.html">D14 approval</a>
      <a href="d15-approval.html">D15 approval</a>
      <a href="loved.html">Customer love reel</a>
      <a href="products.html">Product shots</a>
      <a href="present.html">Presentation</a>
      <a href="index.html">Catalog</a>
    </div>
  </header>
  <main>
    <nav id="nav"></nav>
    <section class="stage">
      <video id="player" controls autoplay playsinline></video>
      <div class="meta" id="meta"></div>
      <div class="beats">
        <span class="beat">1 · Title</span>
        <span class="beat">2 · Hero product</span>
        <span class="beat">3 · Exploded build</span>
        <span class="beat">4 · How it works</span>
        <span class="beat">5 · In the wild</span>
      </div>
    </section>
  </main>
  <script>
    const videos = [
      {id:"A1", name:"Lightline Mg", file:"videos/products/A1-lightline-mg.mp4", sec:14.8},
      {id:"A2", name:"Carbonshell", file:"videos/products/A2-carbonshell.mp4", sec:14.8},
      {id:"A3", name:"Skeleton", file:"videos/products/A3-skeleton.mp4", sec:14.8},
      {id:"A4", name:"Titan-20", file:"videos/products/A4-titan-20.mp4", sec:14.8},
      {id:"B5", name:"Hall-Glove", file:"videos/products/B5-hall-glove.mp4", sec:14.8},
      {id:"B6", name:"Stylus-EMR", file:"videos/products/B6-stylus-emr.mp4", sec:14.8},
      {id:"B7", name:"Lamb-Wave", file:"videos/products/B7-lamb-wave.mp4", sec:14.8},
      {id:"B8", name:"Resistive-Hard", file:"videos/products/B8-resistive-hard.mp4", sec:14.8},
      {id:"B9", name:"Gap-Cap", file:"videos/products/B9-gap-cap.mp4", sec:14.8},
      {id:"C10", name:"Crownpad", file:"videos/products/C10-crownpad.mp4", sec:14.8},
      {id:"C11", name:"Tether-Puck", file:"videos/products/C11-tether-puck.mp4", sec:14.8},
      {id:"C12", name:"Tilt-Cursor", file:"videos/products/C12-tilt-cursor.mp4", sec:14.8},
      {id:"C13", name:"Voice-PTT", file:"videos/products/C13-voice-ptt.mp4", sec:14.8},
      {id:"D14", name:"Rolltop", file:"videos/products/D14-rolltop.mp4", sec:14.8},
      {id:"D15", name:"Oilfill-100", file:"videos/products/D15-oilfill-100.mp4", sec:14.8},
      {id:"D16", name:"Floatline", file:"videos/products/D16-floatline.mp4", sec:14.8},
      {id:"D17", name:"Chestboard", file:"videos/products/D17-chestboard.mp4", sec:14.8},
      {id:"D18", name:"Gauntlet", file:"videos/products/D18-gauntlet.mp4", sec:14.8},
    ];
    const fam = {A:"A — Force", B:"B — Sensing", C:"C — Controls", D:"D — Mission"};
    let cur = 0;
    const nav = document.getElementById("nav");
    const player = document.getElementById("player");
    const meta = document.getElementById("meta");

    let html = "";
    let last = "";
    videos.forEach((v, i) => {
      const f = v.id[0];
      if (f !== last) { html += `<h2>${fam[f]}</h2>`; last = f; }
      html += `<button data-i="${i}">${v.id} ${v.name}</button>`;
    });
    nav.innerHTML = html;

    function load(i) {
      cur = i;
      const v = videos[i];
      player.src = v.file + "?v=hq";
      player.play().catch(()=>{});
      meta.innerHTML = `<strong>${v.id} · ${v.name}</strong> — cinematic HQ · explode · how it works · lifestyle · ${v.sec}s`;
      [...nav.querySelectorAll("button")].forEach((b, idx) => b.classList.toggle("active", idx === i));
    }
    nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => load(+b.dataset.i)));
    player.addEventListener("ended", () => { if (cur < videos.length - 1) load(cur + 1); });
    load(0);
  </script>
</body>
</html>
