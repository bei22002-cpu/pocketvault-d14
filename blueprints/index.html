<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nereid · Interface Catalog & Build Package</title>
  <style>
    :root {
      --bg: #0e1418;
      --panel: #161e24;
      --ink: #e8eef2;
      --muted: #8a9aa6;
      --line: #2a3a44;
      --accent: #3d8a7a;
      --paper: #f4f1ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0 0 6px;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); max-width: 70ch; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .chip {
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .chip strong { color: var(--ink); font-weight: 600; }
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 130px);
    }
    nav {
      border-right: 1px solid var(--line);
      padding: 12px 10px 32px;
      overflow-y: auto;
      background: #0b1014;
      max-height: calc(100vh - 130px);
      position: sticky;
      top: 0;
    }
    nav h2 {
      margin: 14px 8px 6px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--ink);
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
    }
    nav button:hover { background: var(--panel); }
    nav button.active {
      background: var(--accent);
      color: #041210;
      font-weight: 600;
    }
    main { padding: 20px 24px 48px; overflow-x: hidden; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
      align-items: start;
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: none;
        position: static;
      }
      nav h2 { width: 100%; margin-top: 8px; }
      nav button { width: auto; }
      .grid-2 { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .panel h3 {
      margin: 0;
      padding: 11px 14px;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--line);
    }
    .panel .body { padding: 14px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
      color: inherit;
      font: inherit;
      width: 100%;
    }
    .card:hover { border-color: var(--accent); }
    .card img {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .card .cap { padding: 10px 12px; }
    .card .cap strong { display: block; font-size: 0.92rem; }
    .card .cap span { color: var(--muted); font-size: 0.78rem; }
    .render {
      width: 100%;
      display: block;
      background: #111;
    }
    .sheet {
      background: var(--paper);
      color: #1a1a1a;
      border-radius: 4px;
      padding: 8px;
    }
    .sheet svg { width: 100%; height: auto; display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    th, td {
      text-align: left;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    a { color: #9fd4c6; }
    ol.steps { margin: 0; padding-left: 1.2rem; }
    ol.steps li { margin-bottom: 8px; }
    .tools { color: var(--muted); font-size: 0.9rem; }
    .warn {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
      background: #12201c;
      color: #c5ddd6;
      font-size: 0.9rem;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions a {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .actions a:hover { border-color: var(--accent); color: #9fd4c6; }
    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.75rem;
    }
    h2.page {
      margin: 0 0 4px;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Nereid Interface Catalog</h1>
    <p>
      Rev A — 18 submersible phone interfaces. Browse concept blueprints, dimensioned sheets,
      BOMs, assembly steps, and downloadable STL/STEP prototype models.
    </p>
    <div class="stats">
      <span class="chip"><strong>18</strong> designs</span>
      <span class="chip"><strong>56</strong> STL</span>
      <span class="chip"><strong>56</strong> STEP</span>
      <span class="chip"><strong>6–100 m</strong> depth</span>
      <span class="chip"><strong>96–205 g</strong> weight</span>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <script src="designs.js"></script>
  <script>
    const designs = window.NEREID_DESIGNS;
    let current = "home";

    function dimLine(x1, y1, x2, y2, label, opts = {}) {
      const offset = opts.offset ?? 14;
      const horizontal = Math.abs(y2 - y1) < 0.1;
      let ax1, ay1, ax2, ay2, tx, ty;
      if (horizontal) {
        ay1 = ay2 = y1 + (opts.side === "up" ? -offset : offset);
        ax1 = x1; ax2 = x2;
        tx = (x1 + x2) / 2;
        ty = ay1 + (opts.side === "up" ? -4 : 12);
      } else {
        ax1 = ax2 = x1 + (opts.side === "left" ? -offset : offset);
        ay1 = y1; ay2 = y2;
        tx = ax1 + (opts.side === "left" ? -4 : 8);
        ty = (y1 + y2) / 2 + 4;
      }
      return `
        <line x1="${x1}" y1="${y1}" x2="${ax1}" y2="${ay1}" stroke="#5a6a4a" stroke-width="0.6" />
        <line x1="${x2}" y1="${y2}" x2="${ax2}" y2="${ay2}" stroke="#5a6a4a" stroke-width="0.6" />
        <line x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}" stroke="#5a6a4a" stroke-width="0.8" />
        <text x="${tx}" y="${ty}" fill="#3d4a32" font-size="9" font-family="IBM Plex Sans, sans-serif" text-anchor="middle">${label}</text>
      `;
    }

    function buildSvg(d) {
      const ox = 40, oy = 36, scale = 2.2;
      const L = d.outer.L * scale, W = d.outer.W * scale, H = d.outer.H * scale;
      const aL = d.aperture.L * scale, aW = d.aperture.W * scale;
      const ax = ox + (L - aL) / 2, ay = oy + (W - aW) / 2;
      const sx = ox + L + 70, sy = oy;
      const stack = [
        { label: "Shell", h: Math.max(8, (typeof d.shell.t === "number" ? d.shell.t : 1.5) * scale * 2) },
        { label: "Seal", h: 4 },
        { label: "Window " + d.window.t + "mm", h: Math.max(6, d.window.t * scale * 3) },
        { label: "Air pocket", h: 14 },
        { label: "Phone", h: 18 },
        { label: "Back", h: 10 },
      ];
      let stackY = sy + 10;
      const stackRects = stack.map((s) => {
        const r = `<rect x="${sx}" y="${stackY}" width="${H}" height="${s.h}" fill="none" stroke="#1a1a1a" stroke-width="1.1" />
          <text x="${sx + H + 8}" y="${stackY + s.h / 2 + 3}" fill="#333" font-size="9" font-family="IBM Plex Sans, sans-serif">${s.label}</text>`;
        stackY += s.h;
        return r;
      }).join("");
      const senseHint = d.sensing === "Load cell"
        ? `<circle cx="${ax + 8}" cy="${ay + 8}" r="3.5" fill="none" stroke="#1a1a1a" />
           <circle cx="${ax + aL - 8}" cy="${ay + 8}" r="3.5" fill="none" stroke="#1a1a1a" />
           <circle cx="${ax + 8}" cy="${ay + aW - 8}" r="3.5" fill="none" stroke="#1a1a1a" />
           <circle cx="${ax + aL - 8}" cy="${ay + aW - 8}" r="3.5" fill="none" stroke="#1a1a1a" />`
        : "";
      const vbW = sx + H + 160;
      const vbH = Math.max(oy + W + 70, stackY + 40);
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vbW} ${vbH}" width="${vbW}" height="${vbH}">
  <rect width="100%" height="100%" fill="#f4f1ea" />
  <text x="20" y="18" font-size="12" font-weight="600" font-family="IBM Plex Sans, sans-serif" fill="#1a1a1a">${d.id} · ${d.name.toUpperCase()}</text>
  <text x="20" y="30" font-size="8" font-family="IBM Plex Sans, sans-serif" fill="#666">FRONT ELEVATION — ~2.2 px/mm · Nereid Rev A</text>
  <rect x="${ox}" y="${oy}" width="${L}" height="${W}" fill="#fff" stroke="#1a1a1a" stroke-width="1.6" />
  <rect x="${ax}" y="${ay}" width="${aL}" height="${aW}" fill="#e8ece8" stroke="#1a1a1a" stroke-width="1.1" />
  <text x="${ax + aL / 2}" y="${ay + aW / 2}" text-anchor="middle" font-size="9" fill="#555" font-family="IBM Plex Sans, sans-serif">${d.window.material}</text>
  ${senseHint}
  ${dimLine(ox, oy + W, ox + L, oy + W, d.outer.L + " mm", { side: "down" })}
  ${dimLine(ox + L, oy, ox + L, oy + W, d.outer.W + " mm", { side: "right" })}
  ${dimLine(ax, ay, ax + aL, ay, "AP " + d.aperture.L + " mm", { side: "up", offset: 10 })}
  <text x="${sx}" y="${sy - 6}" font-size="9" font-weight="600" fill="#1a1a1a" font-family="IBM Plex Sans, sans-serif">SECTION STACK</text>
  ${stackRects}
  ${dimLine(sx, sy + 10, sx + H, sy + 10, d.outer.H + " mm H", { side: "up", offset: 8 })}
  <text x="20" y="${vbH - 28}" font-size="8" fill="#444" font-family="IBM Plex Sans, sans-serif">Shell: ${d.shell.material}</text>
  <text x="20" y="${vbH - 16}" font-size="8" fill="#444" font-family="IBM Plex Sans, sans-serif">Depth ${d.depthM} m · ${d.weightG} g · ${d.sensing}</text>
  <rect x="${vbW - 150}" y="${vbH - 42}" width="130" height="30" fill="none" stroke="#1a1a1a" stroke-width="0.8" />
  <text x="${vbW - 140}" y="${vbH - 28}" font-size="8" fill="#1a1a1a" font-family="IBM Plex Sans, sans-serif">NEREID PROGRAM</text>
  <text x="${vbW - 140}" y="${vbH - 16}" font-size="8" fill="#1a1a1a" font-family="IBM Plex Sans, sans-serif">DWG ${d.id}-00 · REV A</text>
</svg>`;
    }

    function renderNav() {
      const families = { A: [], B: [], C: [], D: [] };
      designs.forEach((d) => families[d.family].push(d));
      const nav = document.getElementById("nav");
      let html = `<button data-id="home" class="${current === "home" ? "active" : ""}">All designs</button>`;
      html += Object.entries(families)
        .map(([f, list]) => {
          return `<h2>${f} — ${list[0].familyTitle}</h2>` + list.map((d) =>
            `<button data-id="${d.id}" class="${d.id === current ? "active" : ""}">${d.id} ${d.name}</button>`
          ).join("");
        })
        .join("");
      nav.innerHTML = html;
      nav.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          current = btn.dataset.id;
          render();
        });
      });
    }

    function renderHome() {
      document.getElementById("main").innerHTML = `
        <h2 class="page">All 18 designs</h2>
        <p class="tools" style="margin:0 0 16px">Click any card for blueprints, BOM, assembly, and STL/STEP downloads.</p>
        <div class="grid-cards">
          ${designs.map((d) => `
            <button class="card" data-open="${d.id}">
              <img src="${d.image}" alt="${d.id}" loading="lazy" />
              <div class="cap">
                <strong>${d.id} · ${d.name}</strong>
                <span>${d.sensing} · ${d.depthM} m · ${d.weightG} g</span>
              </div>
            </button>
          `).join("")}
        </div>
        <div class="actions">
          <a href="loved.html">Products &amp; customer love film</a>
          <a href="products.html">Product shots</a>
          <a href="demos.html">Watch working demos</a>
          <a href="present.html">Open presentation</a>
          <a href="d14-product-pitch.html">D14 product proposal</a>
          <a href="d14-product-pitch-brief.html">D14 proposal · one-page pre-read</a>
          <a href="d14-approval.html">D14 manufacturing vote</a>
          <a href="PRINT_GUIDE.md" target="_blank">Print &amp; assembly guide</a>
          <a href="models/INDEX.json" target="_blank">CAD index (JSON)</a>
          <a href="README.md" target="_blank">Package README</a>
        </div>
        <footer>
          Nereid Program · Interface Catalog Rev A · Prototype geometry — pressure-test before water use.
        </footer>
      `;
      document.querySelectorAll("[data-open]").forEach((el) => {
        el.addEventListener("click", () => {
          current = el.getAttribute("data-open");
          render();
        });
      });
    }

    function renderDesign(d) {
      const svg = buildSvg(d);
      const svgUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      const modelBase = `models/${d.id}`;
      const parts = d.cadParts || {};
      const cadRows = Object.entries(parts).map(([name, files]) => `
        <tr>
          <td>${name}</td>
          <td><a href="${modelBase}/${files.stl}" download>${files.stl}</a></td>
          <td><a href="${modelBase}/${files.step}" download>${files.step}</a></td>
          <td>${files.volume_mm3 ?? "—"}</td>
        </tr>
      `).join("");

      document.getElementById("main").innerHTML = `
        <h2 class="page">${d.id} · ${d.name}</h2>
        <div class="stats" style="margin:8px 0 16px">
          <span class="chip"><strong>${d.family}</strong> ${d.familyTitle}</span>
          <span class="chip"><strong>${d.depthM} m</strong></span>
          <span class="chip"><strong>${d.weightG} g</strong></span>
          <span class="chip"><strong>${d.sensing}</strong></span>
        </div>
        <div class="grid-2">
          <div class="panel">
            <h3>Concept blueprint</h3>
            <img class="render" src="${d.image}" alt="${d.id}" />
            <div class="body actions">
              <a href="${d.image}" download>PNG</a>
              <a href="${svgUri}" download="${d.id}-orthographic.svg">SVG sheet</a>
              <a href="svg/${d.id}-${d.name.toLowerCase().replace(/\\s+/g, "-")}.svg" download>SVG file</a>
            </div>
          </div>
          <div class="panel">
            <h3>Orthographic sheet (mm)</h3>
            <div class="body">
              <div class="sheet">${svg}</div>
              <p class="tools" style="margin:10px 0 0">
                Outer ${d.outer.L}×${d.outer.W}×${d.outer.H} mm ·
                Aperture ${d.aperture.L}×${d.aperture.W} mm
              </p>
            </div>
          </div>
        </div>
        <div class="panel" style="margin-top:16px">
          <h3>3D models — print / CNC</h3>
          <div class="body" style="padding:0">
            <table>
              <thead><tr><th>Part</th><th>STL</th><th>STEP</th><th>Vol mm³</th></tr></thead>
              <tbody>${cadRows || "<tr><td colspan=4>No CAD parts</td></tr>"}</tbody>
            </table>
            <div class="body">
              <div class="warn">Prototype geometry only. PETG/ASA, 4+ perimeters, COTS O-rings. Real glass from BOM. Pressure-test to 1.5× before water.</div>
              <div class="actions">
                <a href="PRINT_GUIDE.md" target="_blank">Print guide</a>
                <a href="${modelBase}/MANIFEST.json" target="_blank">Manifest</a>
              </div>
            </div>
          </div>
        </div>
        <div class="grid-2" style="margin-top:16px">
          <div class="panel">
            <h3>Bill of materials</h3>
            <div class="body" style="padding:0">
              <table>
                <thead><tr><th>Qty</th><th>Part</th><th>Note</th></tr></thead>
                <tbody>
                  ${d.bom.map((b) => `<tr><td>${b.qty}</td><td>${b.part}</td><td>${b.note || "—"}</td></tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
          <div class="panel">
            <h3>Assembly</h3>
            <div class="body">
              <ol class="steps">${d.assembly.map((s) => `<li>${s}</li>`).join("")}</ol>
              <p class="tools"><strong>Tools:</strong> ${d.tools.join(" · ")}</p>
              <div class="warn">${d.notes}</div>
            </div>
          </div>
        </div>
        <footer>Nereid Program · ${d.id} · Rev A</footer>
      `;
    }

    function render() {
      renderNav();
      if (current === "home") renderHome();
      else {
        const d = designs.find((x) => x.id === current);
        if (d) renderDesign(d);
        else renderHome();
      }
      window.scrollTo(0, 0);
    }

    render();
  </script>
</body>
</html>
